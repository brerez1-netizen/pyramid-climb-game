<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>טיפוס פירמידה - שחקן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1024; --panel: #241533; --gold: #ffb545; --amber: #ff8a3d;
    --text: #fff6e8; --muted: #b8a4c0; --good: #3ecf6e; --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: 'Rubik', sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-weight: 900; font-size: 1.4rem; color: var(--gold); text-align: center; margin: 10px 0 4px; }
  .card { background: var(--panel); border: 2px solid var(--gold); border-radius: 16px; padding: 20px; margin-top: 14px; }
  input[type=text] { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid var(--muted); background: #150c1e; color: var(--text); font-size: 1rem; margin-bottom: 12px; }
  .icons { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
  .icon-opt { font-size: 1.6rem; padding: 8px 10px; border-radius: 10px; border: 2px solid transparent; background: #150c1e; cursor: pointer; }
  .icon-opt.sel { border-color: var(--gold); background: #3a2350; }
  button { width: 100%; font-family: inherit; font-weight: 700; font-size: 1.05rem; border: none; border-radius: 12px; padding: 14px; cursor: pointer; background: linear-gradient(135deg, var(--gold), var(--amber)); color: #2a1400; margin-top: 8px; }
  button:disabled { opacity: 0.4; }
  .progress { text-align: center; color: var(--muted); margin-bottom: 6px; font-size: 0.9rem; }
  .barwrap { background: #150c1e; border-radius: 8px; height: 8px; overflow: hidden; margin-bottom: 14px; }
  .bar { height: 100%; background: linear-gradient(90deg, var(--gold), var(--amber)); transition: width 0.1s linear; }
  .opt { display: block; width: 100%; text-align: right; background: #150c1e; border: 2px solid var(--muted); color: var(--text); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; cursor: pointer; font-family: inherit; font-size: 1rem; }
  .opt.correct { border-color: var(--good); background: rgba(62,207,110,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(255,92,92,0.15); }
  .explain { background: #150c1e; border-radius: 10px; padding: 12px; margin-top: 12px; font-size: 0.92rem; color: var(--muted); }
  .score-badge { position: fixed; top: 10px; left: 10px; background: var(--panel); border: 1px solid var(--gold); border-radius: 20px; padding: 6px 14px; font-weight: 700; }
  .freeze { position: fixed; inset: 0; background: rgba(120,20,20,0.92); z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  .freeze h2 { font-size: 1.6rem; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏔️ טיפוס פירמידה</h1>

  <div id="joinScreen" class="card">
    <input type="text" id="pName" placeholder="שם / כינוי" maxlength="20" />
    <div class="icons" id="iconPicker"></div>
    <button onclick="join()">הצטרפו לטיפוס</button>
  </div>

  <div id="gameScreen" class="hidden">
    <div class="progress" id="progressText"></div>
    <div id="checkpointCard" class="card hidden">
      <p id="checkpointInfo"></p>
      <button onclick="advanceCheckpoint()">המשך בטיפוס</button>
    </div>
    <div id="quizCard" class="card hidden">
      <div class="barwrap"><div class="bar" id="timeBar" style="width:100%;"></div></div>
      <p id="quizQuestion" style="font-weight:700; font-size:1.05rem;"></p>
      <div id="optionsList"></div>
      <div id="explainBox" class="explain hidden"></div>
      <button id="nextBtn" class="hidden" onclick="confirmNext()">המשיכו</button>
    </div>
    <div id="finishCard" class="card hidden">
      <h1>🏔️ הגעתם לפסגה!</h1>
      <p id="finishScore"></p>
      <p id="finishRank"></p>
    </div>
  </div>
</div>

<div class="score-badge" id="scoreBadge" style="display:none;"></div>
<div class="freeze hidden" id="freezeOverlay">
  <h2 id="freezeText"></h2>
  <p id="freezeCountdown"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="js/gameData.js"></script>
<script>
const COLORS = ["#e94560","#4ecdc4","#ffbe0b","#8338ec","#3a86ff","#fb5607","#06d6a0","#ff70a6"];
const myId = localStorage.getItem('piramida_id') || ('p_' + Date.now());
let selectedIcon = window.gameData.characters[0];
let myPlayer = null;
let currentGame = {};
let answerShownAt = null;
let answered = false;
let shownEventAt = 0;
let quizTimer = null;

function buildIconPicker() {
  const wrap = document.getElementById('iconPicker');
  window.gameData.characters.forEach((icon, i) => {
    const el = document.createElement('div');
    el.className = 'icon-opt' + (i === 0 ? ' sel' : '');
    el.innerText = icon;
    el.onclick = () => {
      selectedIcon = icon;
      document.querySelectorAll('.icon-opt').forEach(o => o.classList.remove('sel'));
      el.classList.add('sel');
    };
    wrap.appendChild(el);
  });
}
buildIconPicker();

const firebaseConfig = {
  apiKey: "AIzaSyDbst6-7R6VRFH8wW_WfUUU_d4P4NUIXqc",
  databaseURL: "https://erez-piramida-game-default-rtdb.firebaseio.com",
  projectId: "erez-piramida-game",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function join() {
  const name = document.getElementById('pName').value.trim();
  if (!name) { alert('נא להזין שם'); return; }
  db.ref('players').once('value', snap => {
    const count = snap.exists() ? Object.keys(snap.val()).length : 0;
    const color = COLORS[count % COLORS.length];
    db.ref('players/' + myId).set({
      name, icon: selectedIcon, color, pos: 1, score: 0, finished: false, finishedAt: null,
    });
    localStorage.setItem('piramida_id', myId);
    showGame();
  });
}

function showGame() {
  document.getElementById('joinScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('scoreBadge').style.display = 'block';
}

// rejoin on reload
db.ref('players/' + myId).once('value', snap => { if (snap.exists()) showGame(); });

db.ref('players/' + myId).on('value', snap => {
  myPlayer = snap.val();
  if (!myPlayer) return;
  document.getElementById('scoreBadge').innerText = myPlayer.icon + ' ' + (myPlayer.score || 0) + ' נק\'';
  renderCurrentWaypoint();
});

db.ref('game').on('value', snap => {
  currentGame = snap.val() || {};
  if (currentGame.event && currentGame.event.triggeredAt > shownEventAt) {
    shownEventAt = currentGame.event.triggeredAt;
    showFreeze(currentGame.event);
  }
});

function showFreeze(ev) {
  const overlay = document.getElementById('freezeOverlay');
  const remaining = (ev.triggeredAt + ev.effectSeconds * 1000) - Date.now();
  if (remaining <= 0) return;
  document.getElementById('freezeText').innerText = '⚠️ ' + ev.text;
  overlay.classList.remove('hidden');
  const endAt = ev.triggeredAt + ev.effectSeconds * 1000;
  const tick = setInterval(() => {
    const left = Math.ceil((endAt - Date.now()) / 1000);
    if (left <= 0) { clearInterval(tick); overlay.classList.add('hidden'); return; }
    document.getElementById('freezeCountdown').innerText = left + ' שניות';
  }, 200);
}

let lastRenderedPos = null;
function renderCurrentWaypoint() {
  if (!myPlayer) return;
  // Firebase עלול לירות את אותו value כמה פעמים ברצף (echo מהשרת) - לא לבנות מחדש
  // את כרטיס השאלה תוך כדי שהמשתמש כבר ענה/באמצע אינטראקציה על אותה תחנה בדיוק.
  if (myPlayer.pos === lastRenderedPos) return;
  lastRenderedPos = myPlayer.pos;
  clearInterval(quizTimer);
  document.getElementById('checkpointCard').classList.add('hidden');
  document.getElementById('quizCard').classList.add('hidden');
  document.getElementById('finishCard').classList.add('hidden');

  const total = Object.keys(window.gameData.waypoints).length;
  if (myPlayer.pos >= total) {
    document.getElementById('finishCard').classList.remove('hidden');
    document.getElementById('finishScore').innerText = 'ניקוד סופי: ' + (myPlayer.score || 0);
    db.ref('players').once('value', snap => {
      const all = Object.values(snap.val() || {}).sort((a, b) => (b.score || 0) - (a.score || 0));
      const rank = all.findIndex(p => p.finishedAt === myPlayer.finishedAt && p.score === myPlayer.score) + 1;
      document.getElementById('finishRank').innerText = 'מקום ' + Math.max(1, rank) + ' מתוך ' + all.length;
    });
    return;
  }

  document.getElementById('progressText').innerText = 'תחנה ' + myPlayer.pos + ' מתוך ' + total;
  const target = myPlayer.pos + 1;
  const w = window.gameData.waypoints[target];
  if (!w) return;

  if (w.type === 'checkpoint') {
    document.getElementById('checkpointCard').classList.remove('hidden');
    document.getElementById('checkpointInfo').innerText = w.info;
  } else {
    answered = false;
    document.getElementById('quizCard').classList.remove('hidden');
    document.getElementById('quizQuestion').innerText = w.question;
    document.getElementById('explainBox').classList.add('hidden');
    document.getElementById('nextBtn').classList.add('hidden');
    const list = document.getElementById('optionsList');
    list.innerHTML = '';
    w.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerText = opt;
      btn.onclick = () => submitAnswer(idx, w, target);
      list.appendChild(btn);
    });
    answerShownAt = Date.now();
    let t = 20;
    document.getElementById('timeBar').style.width = '100%';
    quizTimer = setInterval(() => {
      t -= 0.1;
      document.getElementById('timeBar').style.width = Math.max(0, (t / 20) * 100) + '%';
      if (t <= 0) { clearInterval(quizTimer); if (!answered) submitAnswer(-1, w, target); }
    }, 100);
  }
}

function advanceCheckpoint() {
  const target = myPlayer.pos + 1;
  const total = Object.keys(window.gameData.waypoints).length;
  const update = { pos: target };
  if (target >= total) { update.finished = true; update.finishedAt = Date.now(); }
  db.ref('players/' + myId).update(update);
}

let pendingAdvanceTarget = null;

function submitAnswer(idx, w, target) {
  if (answered) return;
  answered = true;
  clearInterval(quizTimer);
  const correct = idx === w.correct;
  const elapsed = answerShownAt ? (Date.now() - answerShownAt) / 1000 : 20;
  const bonus = correct ? Math.max(40, 100 - Math.round(elapsed * 4)) : 0;

  const opts = document.querySelectorAll('.opt');
  opts.forEach((btn, i) => {
    btn.disabled = true;
    if (i === w.correct) btn.classList.add('correct');
    else if (i === idx) btn.classList.add('wrong');
  });
  document.getElementById('explainBox').classList.remove('hidden');
  document.getElementById('explainBox').innerText = (correct ? '✅ נכון! ' : '❌ ') + w.explanation;
  document.getElementById('nextBtn').classList.remove('hidden');

  // חשוב: לא מקדמים pos כאן! אם היינו מקדמים pos מיד, ה-listener על players/{myId}
  // (שמגיב גם ל-echo אופטימי מקומי של Firebase, כמעט מיידי - לא רק לתשובת השרת)
  // היה קופץ ישר לשאלה הבאה ומוחק את מסך ההסבר/הצבעים לפני שהשחקן הספיק לראות אותו.
  // רק העדכון של score נשלח עכשיו; pos מתקדם רק כשלוחצים "המשיכו" (confirmNext).
  pendingAdvanceTarget = target;
  db.ref('players/' + myId).transaction(p => {
    if (!p) return p;
    p.score = (p.score || 0) + bonus;
    return p;
  });
}

function confirmNext() {
  if (pendingAdvanceTarget == null) { renderCurrentWaypoint(); return; }
  const target = pendingAdvanceTarget;
  pendingAdvanceTarget = null;
  const total = Object.keys(window.gameData.waypoints).length;
  const update = { pos: target };
  if (target >= total) { update.finished = true; update.finishedAt = Date.now(); }
  db.ref('players/' + myId).update(update);
}
</script>
</body>
</html>
